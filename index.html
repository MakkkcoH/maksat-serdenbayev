<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Investment Calculator</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Savings</h2>

        <div class="input-group">
            <label>Name</label>
            <input type="text" id="userName" placeholder="John">
        </div>

        <div class="input-group">
            <label>Monthly Contribution ($)</label>
            <input type="number" id="monthlyAmount" placeholder="5000" min="0">
        </div>

        <div class="input-group">
            <label>Interest Rate (% p.a.)</label>
            <input type="number" id="interestRate" placeholder="12" min="0">
        </div>

        <div class="input-group">
            <label>Period (years)</label>
            <input type="number" id="years" placeholder="5" min="0">
        </div>

        <button onclick="calculate()">Calculate</button>

        <div id="result"></div>
    </div>

    <!-- JS -->
    <script src="script.js"></script>
</body>
</html>
